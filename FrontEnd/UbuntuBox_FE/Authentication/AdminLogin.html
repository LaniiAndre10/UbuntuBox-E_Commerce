<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="AdminLogin.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="admin-container">

        <div class="admin-form">
            <h1>Admin <span>Login!</span></h1>
            <p class="admin-subtitle"> Manage your products and store</p>

            <form>
                <label for="email">Email</label>

                <div class="input-container">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <label for="password">Password</label>

                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <label><input type="checkbox" class="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button">Login</button>

            </form>

            <p class="add-admin"> More than one admin? <a href="AddAdmin.html">&nbsp;Add Admin</a></p>
            
            <p class="customer-login">Not a seller?<a href="LoginPage.html">&nbsp;Customer Login</a></p>

            <hr>

            <a href="Register.html" class="customer-register">Don't have a customer account?&nbsp;<span>Register</span></a>

        </div>

        <div class="admin-image">

            <img src="images/956848f7d698994bca3c03767bb48ff70c9996fe20522e2a068f5c4a7c74431c.png" width="350" height="350" alt="Seller Login">

        </div>

    </div>
</body>
</html>
