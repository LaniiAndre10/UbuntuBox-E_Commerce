<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="LoginPage.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>

    <div class="login-container">

      <div class="login-image">
        <img src="images/956848f7d698994bca3c03767bb48ff70c9996fe20522e2a068f5c4a7c74431c.png" width="350" height="350" alt="Login Image"/>
      </div>

      <div class="login-form">
        <h1>Welcome <span> Back!</span></h1>

        <form>
          <label>Name & Surname</label>
          <div class="input-container">
            <i class="fa-solid fa-user"></i>
            <input type="email" placeholder="Enter your name and surname" />
          </div>

          <label>Email</label>
          <div class="input-container">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" placeholder="Enter your email" />
          </div>

          <label>Password</label>
          <div class="input-container">
            <i class="fa-solid fa-unlock-keyhole"></i>
            <input type="email" placeholder="Enter your password" />
          </div>

          <div class="options">
            <label><input type="checkbox" class="checkbox" />&nbsp;Remember me</label>
            <a href="#"><span>Forgot Password?</span></a>
          </div>

          <button type="submit">Login</button>
        </form>

        <div class="social-login">
          <p>Continue with</p>

          <button><i class="fa-brands fa-google"></i>Google</button>
          <button><i class="fa-brands fa-microsoft"></i>Microsoft</button>
          <button><i class="fa-brands fa-apple"></i>Apple</button>
        </div>

        <p class="register-link">Don't have an account?<a href="register.html">&nbsp;<span>Register</span></a></p>
        <hr>
        <a href="AdminLogin.html">Also a seller?&nbsp;<span>Admin Login</span></a>
      </div>
    </div>

  </body>
</html>
