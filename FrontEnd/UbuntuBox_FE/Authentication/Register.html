<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Register.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="register-container">

        <div class="register-image">
            <img src="images/956848f7d698994bca3c03767bb48ff70c9996fe20522e2a068f5c4a7c74431c.png" alt="Register Image" width="350" height="350">
        </div>

        <div class="register-form">

            <h1>Create <span>Account!</span></h1>

            <form>

                <label for="name">Name &amp; Surname</label>

                <div class="input-container">

                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="name" placeholder="Enter your name and surname" required>

                </div>

                <label for="email">Email</label>

                <div class="input-container">

                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>

                </div>

                <label for="phone">Phone Number</label>

                <div class="input-container">

                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>

                </div>

                <label for="password">Password</label>

                <div class="input-container">

                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Create a password" required>

                </div>

                <label for="confirm-password">Confirm Password</label>

                <div class="input-container">

                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirm-password" placeholder="Confirm your password" required>

                </div>

                <button type="submit">Create Account</button>

            </form>

            <p class="login-link">Already have an account?<a href="LoginPage.html">&nbsp;Login</a></p>

            <hr>

            <a href="AdminLogin.html" class="seller-link">Also a seller?<span>&nbsp;Admin Login</span></a>

        </div>

    </div>
</body>
</html>
