<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="AddAdmin.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="admin-container">

        <div class="admin-form">

            <h1>Add <span>Admin!</span></h1>
            <p class="admin-subtitle">Create another administrator account</p>

            <form>
                <label for="name">Name &amp; Surname</label>

                <div class="input-container">

                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="name" placeholder="Enter name and surname" required>

                </div>

                <label for="email">Email</label>

                <div class="input-container">

                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter admin email" required>

                </div>

                <label for="phone">Phone Number</label>

                <div class="input-container">

                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>

                </div>

                <label for="password">Password</label>

                <div class="input-container">

                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Create a password" require>

                </div>

                <label for="confirm-password">Confirm Password</label>

                <div class="input-container">

                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirm-password" placeholder="Confirm password" required>

                </div>

                <button type="submit" class="add-admin-button">Add Admin</button>

            </form>

            <p class="back-login">Already an admin?<a href="AdminLogin.html">&nbsp;Admin Login</a></p>

            <hr>

            <a href="LoginPage.html" class="customer-login">Not a seller?<span>&nbsp;Customer Login</span></a>

        </div>

        <div class="admin-image">
            <img src="images/956848f7d698994bca3c03767bb48ff70c9996fe20522e2a068f5c4a7c74431c.png" width="350" height="350" alt="Add Admin">
        </div>

    </div>

</body>
</html>
